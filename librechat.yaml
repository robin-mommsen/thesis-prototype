version: 1.1.5
cache: true

endpoints:
  custom:
    - name: "Upcycling RAG"
      apiKey: "dummy"
      baseURL: "http://backend:8080/v1"
      models:
        default: ["rag", "no-rag"]
        fetch: false
      titleConvo: false
      forcePrompt: false
      modelDisplayLabel: "Modus"
      dropParams:
        - "temperature"
        - "frequency_penalty"
        - "presence_penalty"
        - "top_p"
        - "stop"
        - "n"
